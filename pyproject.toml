[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "computeid-cli"
dynamic = ["version"]
description = "CLI for ComputeID: issue, verify and revoke cryptographic AgentPassports"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ComputeID", email = "hello@compute-id.com" }]
requires-python = ">=3.9"
dependencies = [
  "click>=8.0.0",
  "requests>=2.28.0",
  "rich>=13.0.0",
]
keywords = ["ai-agents", "identity", "agentpassport", "post-quantum", "security", "cli", "computeid"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://aicomputeid.com"
Source = "https://github.com/trustedaicompute-ops/computeid-cli"
Changelog = "https://github.com/trustedaicompute-ops/computeid-cli/blob/master/CHANGELOG.md"

[project.scripts]
computeid = "computeid_cli:cli"

[tool.setuptools]
py-modules = ["computeid_cli"]

[tool.setuptools.dynamic]
version = { attr = "computeid_cli.__version__" }
